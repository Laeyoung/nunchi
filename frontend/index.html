<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1b1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<title>Nunchi 눈치</title>
<style>
  :root { --ink:#1b1b1f; --accent:#e5484d; --soft:#f4f1ec; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Hiragino Sans","Apple SD Gothic Neo",sans-serif; color:var(--ink); background:var(--soft); }
  header { padding:16px 20px 8px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  h1 { font-size:22px; margin:0; } h1 small { font-weight:400; opacity:.6; font-size:13px; margin-left:6px; }
  select, button, label.btn { font:inherit; border-radius:12px; border:0; padding:10px 14px; }
  main { padding:0 16px 40px; max-width:640px; margin:0 auto; }
  label.btn { display:block; text-align:center; background:var(--ink); color:#fff; font-weight:600; margin:8px 0 14px; cursor:pointer; }
  #stage { position:relative; display:none; border-radius:16px; overflow:hidden; touch-action:manipulation; }
  #photo { width:100%; display:block; user-select:none; -webkit-user-select:none; }
  .cand { position:absolute; border:2px dashed rgba(255,255,255,.85); border-radius:6px; background:rgba(229,72,77,.12); pointer-events:none; }
  .box { position:absolute; border:3px solid var(--accent); border-radius:6px; box-shadow:0 0 0 2000px rgba(0,0,0,.25); pointer-events:none; }
  .dot { position:absolute; width:18px; height:18px; margin:-9px; border-radius:50%; background:var(--accent); border:3px solid #fff; pointer-events:none; }
  #hint { text-align:center; opacity:.7; margin:10px 0; }
  .pick { display:flex; gap:8px; margin:8px 0 10px; } .pick label.btn { flex:1; margin:0; }
  label.btn.alt { background:#fff; color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--ink); }
  #samples { margin:0 0 12px; } #samples summary { cursor:pointer; opacity:.75; padding:6px 2px; font-size:15px; }
  #notice { font-size:13px; opacity:.7; margin:4px 2px 8px; display:none; }
  #grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:6px 0 4px; }
  body.demo #grid { grid-template-columns:repeat(3,1fr); }
  #grid img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; cursor:pointer; }
  .card { background:#fff; border-radius:16px; padding:18px; margin-top:14px; box-shadow:0 2px 12px rgba(0,0,0,.06); display:none; }
  .ko { font-size:30px; font-weight:800; } .rom { opacity:.6; margin-bottom:10px; }
  .row { margin:10px 0; } .row b { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.04em; opacity:.55; }
  .bridge { background:#fff6e5; border-radius:12px; padding:10px 12px; }
  .actions { display:flex; gap:8px; margin-top:12px; } .actions button { flex:1; background:var(--soft); }
  .low { color:#b54708; font-size:13px; }
  .spinner { display:none; text-align:center; padding:14px; }
  .spinner i { display:inline-block; width:10px; height:10px; margin:0 3px; border-radius:50%; background:var(--accent); animation:b 1s infinite ease-in-out; }
  .spinner i:nth-child(2){animation-delay:.15s} .spinner i:nth-child(3){animation-delay:.3s}
  @keyframes b { 0%,80%,100%{transform:scale(.4);opacity:.4} 40%{transform:scale(1);opacity:1} }
  .err { display:none; background:#fff; border-radius:16px; padding:14px; margin-top:14px; text-align:center; }
  .err button { background:var(--ink); color:#fff; margin-top:8px; }
  .more { display:none; margin-top:12px; padding:12px; border-radius:12px; background:var(--soft); font-size:15px; line-height:1.5; }
  .more a { display:block; font-size:12px; color:inherit; opacity:.7; margin-top:6px; word-break:break-all; }
  #moreBtn { width:100%; margin-top:8px; background:transparent; border:1px solid rgba(0,0,0,.12); }
  .meta { font-size:11px; opacity:.4; margin-top:10px; text-align:right; }
</style>
</head>
<body>
<header>
  <h1><span id="appName">Nunchi 눈치</span><small id="tagline">찍으면 들리는 한국</small></h1>
  <select id="lang" aria-label="language">
    <option value="ja">日本語</option><option value="en">English</option><option value="zh">中文</option>
  </select>
</header>
<main>
  <div class="pick" id="pickRow">
    <label class="btn" id="takeBtn"><span id="take">📷</span><input id="file" type="file" accept="image/*" capture="environment" hidden></label>
    <label class="btn alt" id="albumBtn"><span id="album">🖼</span><input id="file2" type="file" accept="image/*" hidden></label>
  </div>
  <p id="notice"></p>
  <details id="samples"><summary id="samplesLabel"></summary><div id="grid"></div></details>
  <div id="stage"><img id="photo" alt=""></div>
  <p id="hint"></p>
  <div class="spinner" id="spin"><i></i><i></i><i></i><div id="spinText" style="opacity:.6;margin-top:6px"></div></div>
  <div class="err" id="err"><div id="errText"></div><button id="retry"></button></div>
  <div class="card" id="card">
    <div class="ko" id="ko"></div><div class="rom" id="rom"></div>
    <div class="row"><b id="l-meaning"></b><span id="meaning"></span></div>
    <div class="row"><b id="l-why"></b><span id="why"></span></div>
    <div class="row"><b id="l-do"></b><span id="todo"></span></div>
    <div class="row bridge" id="bridgeRow"><span id="bridge"></span></div>
    <div class="low" id="low"></div>
    <div class="actions"><button id="play"></button><button id="playKo">🇰🇷 원음</button></div>
    <button id="moreBtn"></button>
    <div class="more" id="more"></div>
    <div class="meta" id="meta"></div>
  </div>
</main>
<script>
const UI = {
  ja:{take:"📷 写真を撮る", album:"🖼 アルバムから", samples:"サンプル写真で試す", offlineNote:"この公開デモではサンプル写真だけを使えます。", hint:"知りたい文字をタップしてください", meaning:"意味", why:"なぜここに？", todo:"どうすればいい？",
      play:"▶︎ 聞く", stop:"■ 止める", more:"🔎 もっと詳しく", moreWait:"調べています…", src:"出典", low:"自信が低い結果です", thinking:"読んでいます…",
      err:"うまく読み取れませんでした。", offline:"公開デモでは、サンプル写真の解説だけを再生しています。下の写真を選んでください。", timeout:"時間がかかりすぎています。", retry:"もう一度", voice:"ja-JP"},
  en:{take:"📷 Take a photo", album:"🖼 From library", samples:"Try a sample photo", offlineNote:"This public demo works with the sample photos only.", hint:"Tap the Korean text you want to understand", meaning:"Meaning", why:"Why is it here?", todo:"What should I do?",
      play:"▶︎ Listen", stop:"■ Stop", more:"🔎 Tell me more", moreWait:"Looking it up…", src:"Source", low:"Low-confidence answer", thinking:"Reading the sign…",
      err:"Something went wrong.", offline:"This public demo replays the sample photos only. Pick one below.", timeout:"This is taking too long.", retry:"Try again", voice:"en-US"},
  zh:{take:"📷 拍照", album:"🖼 从相册选择", samples:"用示例照片试试", offlineNote:"此公开演示仅支持示例照片。", hint:"点击你想了解的韩文", meaning:"意思", why:"为什么在这里？", todo:"我该怎么做？",
      play:"▶︎ 收听", stop:"■ 停止", more:"🔎 了解更多", moreWait:"正在查找…", src:"来源", low:"置信度较低", thinking:"正在识别…",
      err:"出了点问题。", offline:"公开演示只播放示例照片的结果，请选择下方的照片。", timeout:"等待时间过长。", retry:"重试", voice:"zh-CN"},
};
// Preferred voices per language, best first (iOS / macOS / Chrome names).
const VOICE_PREF = {
  "ja-JP":["Kyoko","O-ren","Otoya","Google 日本語"], "en-US":["Samantha","Ava","Google US English"],
  "zh-CN":["Tingting","Ting-Ting","Google 普通话"], "ko-KR":["Yuna","Google 한국어"],
};
const TIMEOUT_MS = 24000;
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search), DEMO = params.has("demo");
let file = null, last = null, demoTaps = null, seq = 0, LIVE = true;
const u = () => UI[$("lang").value];

fetch("/api/config").then(r => r.json()).then(c => {
  const nm = c.name_ko ? c.name + " " + c.name_ko : c.name;
  $("appName").textContent = nm; $("tagline").textContent = c.tagline; document.title = nm + " · " + c.tagline;
  // Cache-only deployment: no live analysis, so only the sample photos work.
  if (c.live === false) { LIVE = false; $("pickRow").style.display = "none"; $("samples").open = true; t(); }
}).catch(() => {});

function t(){
  $("take").textContent = u().take; $("album").textContent = u().album; $("samplesLabel").textContent = u().samples;
  $("notice").textContent = u().offlineNote; $("notice").style.display = !LIVE && !DEMO ? "block" : "none";
  $("hint").textContent = file ? u().hint : "";
  $("l-meaning").textContent = u().meaning; $("l-why").textContent = u().why; $("l-do").textContent = u().todo;
  $("retry").textContent = u().retry; $("spinText").textContent = u().thinking; setPlayLabel();
}
$("lang").onchange = () => { t(); try { localStorage.setItem("lang", $("lang").value); } catch {} if (last) explain(last.nx, last.ny); };

function loadPhoto(f, taps){
  file = f; demoTaps = taps || null; last = null;
  $("photo").src = URL.createObjectURL(f); $("stage").style.display = "block";
  $("card").style.display = "none"; $("err").style.display = "none"; clearMarks(); stop(); t();
  segment(f);
  $("stage").scrollIntoView({behavior:"smooth", block:"start"});
}
// Own photos: shrink big camera files in the browser (faster upload; hosting caps request bodies at ~4.5 MB).
// Drawing applies the EXIF orientation, so the result is upright. Sample photos are sent as-is to match the cache.
async function shrink(f, maxSide = 1600){
  if (f.size <= 1_500_000 && /jpe?g/i.test(f.type)) return f;
  try {
    const bmp = await createImageBitmap(f, {imageOrientation:"from-image"});
    const s = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height); bmp.close?.();
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.88));
    return blob ? new File([blob], "photo.jpg", {type:"image/jpeg"}) : f;
  } catch { return f; }
}
async function pickOwn(e){
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  $("samples").open = false; loadPhoto(await shrink(f));
}
$("file").onchange = pickOwn; $("file2").onchange = pickOwn;

// Candidate highlights: draw faint boxes; the server reuses them when a tap lands inside.
async function segment(f){
  const my = ++seq; const fd = new FormData(); fd.append("image", f);
  try {
    const r = await fetch("/api/segment", {method:"POST", body:fd}); if (!r.ok || my !== seq) return;
    const d = await r.json(); if (my !== seq) return;
    for (const b of d.boxes) addRect("cand", b, d.width, d.height);
  } catch {}
}
function addRect(cls, b, W, H){
  const el = document.createElement("div"); el.className = cls;
  Object.assign(el.style, {left:b.x1/W*100+"%", top:b.y1/H*100+"%", width:(b.x2-b.x1)/W*100+"%", height:(b.y2-b.y1)/H*100+"%"});
  $("stage").appendChild(el);
}
function clearMarks(sel = ".box,.dot,.cand"){ document.querySelectorAll(sel).forEach(n => n.remove()); }

$("stage").onclick = e => {
  const r = $("photo").getBoundingClientRect();
  let nx = (e.clientX - r.left) / r.width, ny = (e.clientY - r.top) / r.height;
  if (demoTaps) [nx, ny] = demoTaps.reduce((a, p) => Math.hypot(p[0]-nx, p[1]-ny) < Math.hypot(a[0]-nx, a[1]-ny) ? p : a);
  explain(nx, ny);
};

async function explain(nx, ny){
  last = {nx, ny}; stop(); clearMarks(".box,.dot");
  const d = document.createElement("div"); d.className = "dot";
  d.style.left = (nx*100)+"%"; d.style.top = (ny*100)+"%"; $("stage").appendChild(d);
  $("spin").style.display = "block"; $("card").style.display = "none"; $("err").style.display = "none";
  const lang = $("lang").value, fd = new FormData();
  fd.append("image", file); fd.append("lang", lang); fd.append("nx", nx); fd.append("ny", ny);
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), TIMEOUT_MS), started = performance.now();
  try {
    const res = await fetch("/api/explain", {method:"POST", body:fd, signal:ctl.signal});
    const data = await res.json().catch(() => ({}));
    if (!last || last.nx !== nx || last.ny !== ny || lang !== $("lang").value) return;  // superseded
    if (!res.ok || !data.result) return showError(data.error === "timeout" ? "timeout" : data.error === "offline" ? "offline" : "err");
    render(data, ((performance.now() - started) / 1000).toFixed(1));
    speak(data.result.narration, UI[lang].voice);
  } catch (err) {
    showError(err.name === "AbortError" ? "timeout" : "err");
  } finally { clearTimeout(timer); $("spin").style.display = "none"; }
}
// "Tell me more": web-search-grounded background, only on request (keeps the main flow fast and cheap).
async function tellMore(r){
  const lang = $("lang").value, box = $("more"), btn = $("moreBtn");
  btn.disabled = true; btn.textContent = UI[lang].moreWait;
  const fd = new FormData(); fd.append("korean_text", r.korean_text); fd.append("meaning", r.meaning); fd.append("lang", lang);
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 30000);
  try {
    const res = await fetch("/api/more", {method:"POST", body:fd, signal:ctl.signal});
    const d = await res.json().catch(() => ({}));
    if (lang !== $("lang").value) return;
    if (!res.ok || !d.text) throw new Error(d.error || "failed");
    box.textContent = d.text;
    for (const s of d.sources || []) {
      const a = document.createElement("a"); a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = UI[lang].src + ": " + s.title; box.appendChild(a);
    }
    box.style.display = "block"; btn.style.display = "none"; speak(d.text, UI[lang].voice);
  } catch (err) {
    btn.disabled = false; btn.textContent = err.name === "AbortError" ? UI[lang].timeout + " " + UI[lang].retry
      : err.message === "offline" ? UI[lang].offline : UI[lang].err + " " + UI[lang].retry;
  } finally { clearTimeout(timer); }
}

function showError(kind){
  $("errText").textContent = u()[kind] || u().err; $("err").style.display = "block";
  $("retry").style.display = kind === "offline" ? "none" : "";
}
$("retry").onclick = () => last && explain(last.nx, last.ny);

function render(data, secs){
  const r = data.result;
  clearMarks(".box");
  if (data.box) addRect("box", data.box, data.image_size[0], data.image_size[1]);
  $("ko").textContent = r.korean_text;
  $("rom").textContent = [r.romanization, r.pronunciation_hint].filter(Boolean).join("  ·  ");
  $("meaning").textContent = r.meaning; $("why").textContent = r.why_here; $("todo").textContent = r.what_to_do;
  $("bridge").textContent = r.native_bridge; $("bridgeRow").style.display = r.native_bridge ? "block" : "none";
  $("low").textContent = r.confidence === "low" ? u().low : "";
  $("meta").textContent = (data.cached ? "cached · " : "") + secs + "s · " + (data.region_source || "");
  $("card").style.display = "block";
  const voice = u().voice;
  $("play").onclick = () => speaking ? stop() : speak(r.narration, voice);
  $("playKo").onclick = () => speak(r.korean_text, "ko-KR", .8);
  $("more").style.display = "none"; $("more").textContent = "";
  $("moreBtn").style.display = r.korean_text ? "block" : "none"; $("moreBtn").disabled = false;
  $("moreBtn").textContent = u().more;
  $("moreBtn").onclick = () => tellMore(r);
}

// --- speech ---
let voices = [], speaking = false;
function loadVoices(){ voices = speechSynthesis.getVoices(); }
loadVoices(); speechSynthesis.addEventListener?.("voiceschanged", loadVoices);
// iOS Safari only allows speech that starts inside a user gesture. Narration starts after a network
// round-trip, so speak an empty utterance on the first touch to unlock later async speech.
function unlockSpeech(){
  try { const s = new SpeechSynthesisUtterance(" "); s.volume = 0; speechSynthesis.speak(s); } catch {}
  document.removeEventListener("touchend", unlockSpeech, true); document.removeEventListener("click", unlockSpeech, true);
}
document.addEventListener("touchend", unlockSpeech, true); document.addEventListener("click", unlockSpeech, true);
function pickVoice(lang){
  const norm = v => v.lang.replace("_", "-");
  const same = voices.filter(v => norm(v) === lang), loose = voices.filter(v => norm(v).startsWith(lang.slice(0, 2)));
  for (const name of VOICE_PREF[lang] || []) { const v = same.find(v => v.name.includes(name)); if (v) return v; }
  return same.find(v => v.localService) || same[0] || loose[0] || null;
}
function setPlayLabel(){ $("play").textContent = speaking ? u().stop : u().play; }
function stop(){ speechSynthesis.cancel(); speaking = false; setPlayLabel(); }
function speak(text, lang, rate = 1){
  speechSynthesis.cancel(); if (!text) return;
  const s = new SpeechSynthesisUtterance(text); s.lang = lang; s.rate = rate;
  const v = pickVoice(lang); if (v) s.voice = v;
  s.onstart = () => { speaking = true; setPlayLabel(); };
  s.onend = s.onerror = () => { speaking = false; setPlayLabel(); };
  speechSynthesis.speak(s);
}

// --- sample photos: always offered; taps snap to preset points so cached results replay instantly ---
// ?demo=1 (used for the video) shows only the samples, open.
if (DEMO) { document.body.classList.add("demo"); $("pickRow").style.display = "none"; $("samples").open = true; $("samplesLabel").style.display = "none"; }
fetch("/api/demo").then(r => r.json()).then(d => {
  for (const p of d.photos) {
    const img = document.createElement("img"); img.src = "/demo-images/" + p.file; img.alt = p.file; img.loading = "lazy";
    img.onclick = async () => {
      const blob = await (await fetch(img.src)).blob();
      if (!DEMO) $("samples").open = false;
      loadPhoto(new File([blob], p.file, {type:"image/jpeg"}), p.taps);
    };
    $("grid").appendChild(img);
  }
});
try { const saved = localStorage.getItem("lang"); if (saved && UI[saved]) $("lang").value = saved; } catch {}
if (params.get("lang") && UI[params.get("lang")]) $("lang").value = params.get("lang");
t();
</script>
</body>
</html>
